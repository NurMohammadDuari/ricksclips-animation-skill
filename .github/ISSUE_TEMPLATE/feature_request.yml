name: Feature request
description: Propose a gate, a set archetype, a pose, a camera formula or a tool
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The best proposals come from a real episode. Say what broke and what
        would have fixed it.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gates / film_plan.py
        - Any-script generator (autofilm.py)
        - Audio analysis / word timing
        - Camera / cinematography
        - Sets / place_kit
        - Characters / cast
        - Poses / animation
        - Three.js render kit
        - Blender look pass
        - Docs / install
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change?
      description: A gate needs a name, a measured value, a target and a fix line.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: An episode, a still, a gate report or a link.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
